<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0a1a" />
  <meta name="description" content="Rebel Repair - Weltraum-Reparaturspiel am Rande der Galaxis" />
  
  <!-- PWA Manifest -->
  <link rel="manifest" href="/manifest.json" />
  
  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg" />
  
  <!-- Apple Touch Icons -->
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />
  
  <!-- Microsoft Tiles -->
  <meta name="msapplication-TileColor" content="#0a0a1a" />
  <meta name="msapplication-TileImage" content="/icons/icon-192.png" />
  
  <title>Rebel Repair</title>
  
  <!-- Prevent overscroll bounce on iOS -->
  <style>
    html, body {
      overscroll-behavior: none;
      -webkit-overflow-scrolling: touch;
    }
  </style>
  
  <!-- Loading Screen -->
  <style>
    .initial-loading {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a1a2a 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10000;
      color: #00ff88;
    }
    
    .initial-loading h1 {
      font-size: 32px;
      margin-bottom: 20px;
      text-shadow: 0 0 10px #00ff88;
    }
    
    .initial-loading .loader {
      width: 60px;
      height: 60px;
      border: 4px solid #333;
      border-top-color: #00ff88;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .initial-loading p {
      margin-top: 20px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <!-- Loading Screen -->
  <div class="initial-loading" id="loading-screen">
    <h1>REBEL REPAIR</h1>
    <div class="loader"></div>
    <p>Lade Spiel...</p>
  </div>

  <!-- Portrait Warning -->
  <div class="portrait-warning" id="portrait-warning">
    <h2>Bitte drehe dein Gerät</h2>
    <p>Für das beste Spielerlebnis empfehlen wir Querformat.</p>
    <button onclick="document.getElementById('portrait-warning').classList.remove('show')">Weiter</button>
  </div>

  <!-- Game Canvas -->
  <canvas id="game-canvas"></canvas>

  <script type="module" src="/src/main.ts"></script>
  
  <!-- Portrait Detection -->
  <script>
    function checkOrientation() {
      const warning = document.getElementById('portrait-warning');
      if (window.innerHeight > window.innerWidth) {
        warning.classList.add('show');
      } else {
        warning.classList.remove('show');
      }
    }
    
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    
    // Hide loading screen when ready
    window.addEventListener('load', () => {
      setTimeout(() => {
        document.getElementById('loading-screen').style.display = 'none';
      }, 1000);
    });
  </script>
</body>
</html>
